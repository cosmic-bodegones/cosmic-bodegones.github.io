<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de imágenes COSMIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Idea: herramienta de revisión. Arriba el resumen y los filtros; debajo una rejilla 4:5 sobre gris frío
     para que el fondo cálido del estudio (#D9D3C9) destaque; visor oscuro a pantalla completa con panel de revisión. */
  --bg:#ECEEEF; --surface:#FFFFFF; --ink:#16191C; --muted:#5B636A; --line:#D2D7DB; --accent:#0E5A6B; --accent-ink:#FFFFFF;
  --well:#D9D3C9; --ok:#1F7A4D; --chg:#B4530A; --fix:#4450B5; --rev:#69727A; --miss:#9AA2A8; --hatch:#DDE1E4;
  --font-d:"Archivo","Arial Narrow",Arial,sans-serif; --font-b:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --font-m:"IBM Plex Mono",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#121416;--surface:#1B1E21;--ink:#E9ECEE;--muted:#9BA3AA;--line:#2D3237;--accent:#62B9C9;--accent-ink:#06262D;--ok:#4CC38A;--chg:#F0994A;--fix:#939DF5;--rev:#9AA3AB;--miss:#5C646B;--hatch:#23272B}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121416;--surface:#1B1E21;--ink:#E9ECEE;--muted:#9BA3AA;--line:#2D3237;--accent:#62B9C9;--accent-ink:#06262D;--ok:#4CC38A;--chg:#F0994A;--fix:#939DF5;--rev:#9AA3AB;--miss:#5C646B;--hatch:#23272B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-b);-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:700 20px/1 var(--font-d);font-stretch:118%;letter-spacing:.14em}
.brand span{font:500 14px/1 var(--font-d);color:var(--muted);white-space:nowrap}
.prog{flex:1 1 220px;min-width:180px;display:flex;flex-direction:column;gap:5px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--hatch)}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .chg{background:var(--chg)}.bar .fix{background:var(--fix)}.bar .rev{background:var(--rev)}
.prog small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:default}
.btn .n{font:500 12px var(--font-m);background:var(--chg);color:#fff;border-radius:10px;padding:1px 7px}
.btn .n.z{background:var(--hatch);color:var(--muted)}
.conn{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--miss)}
.conn.on::before{background:var(--ok)}.conn.lc::before{background:var(--chg)}

/* filtros */
.filters{padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fld{display:flex;flex-direction:column;gap:3px;flex:1 1 150px;min-width:140px;max-width:260px}
.fld label{font:500 11px/1 var(--font-d);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld select,.fld input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;width:100%}
.fld.q{flex:2 1 220px;max-width:340px}
.fbox>summary{list-style:none;display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-weight:500;cursor:pointer}
.fbox>summary::-webkit-details-marker{display:none}
.fbox[open]>summary{margin-bottom:10px}
@media (max-width:700px){.fbox>summary{display:block}.fld{max-width:none;flex:1 1 140px}.fld.q{max-width:none;flex:1 1 100%}
  .chips#stChips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.chips#stChips .chip{flex:none}
  .top{padding:10px 16px;gap:8px 12px}.conn{flex:1 1 100%}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.chip .c{font:500 12px var(--font-m);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.75}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--rev)}
.dot.ok{background:var(--ok)}.dot.chg{background:var(--chg)}.dot.fix{background:var(--fix)}.dot.rev{background:var(--rev)}
.dot.miss{background:transparent;border:1.5px dashed var(--miss)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.tools .cnt{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin:0 16px 10px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--chg);background:var(--surface);border-radius:8px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.note p{margin:0;flex:1 1 260px}

/* rejilla de imágenes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding:0 16px 24px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column;position:relative}
.tile:hover{border-color:var(--muted)}
.ph{aspect-ratio:4/5;background:var(--well);position:relative;display:block;width:100%}
.tb{position:absolute;inset:0;background-repeat:no-repeat;display:block}
.ph.miss{background:repeating-linear-gradient(135deg,var(--hatch) 0 8px,transparent 8px 16px);display:flex;align-items:center;justify-content:center}
.ph.miss span{font:500 11px var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:4px}
.pill{position:absolute;left:7px;top:7px;max-width:calc(100% - 14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 11px/1 var(--font-d);letter-spacing:.02em;padding:5px 8px;border-radius:999px;color:#fff;background:var(--rev)}
.pill.ok{background:var(--ok)}.pill.chg{background:var(--chg)}.pill.fix{background:var(--fix)}.pill.rev{background:rgba(22,25,28,.62)}
.cm{position:absolute;right:7px;bottom:7px;font:500 11px/1 var(--font-m);padding:5px 7px;border-radius:999px;background:#fff;color:#16191C;display:inline-flex;gap:4px;align-items:center}
.new{position:absolute;left:8px;bottom:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}
.cap{padding:8px 10px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cap .s{font:500 12.5px var(--font-m)}
.cap .v{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.cap .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}

/* vista por accesorio */
.fams{display:flex;flex-direction:column;gap:12px;padding:0 16px 24px}
.fam{border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.fam header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;padding:12px 14px}
.fam h3{margin:0;font:600 16px/1.2 var(--font-d);text-wrap:balance}
.fam .meta{font-size:13px;color:var(--muted)}
.fam .sum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.mx{overflow-x:auto;border-top:1px solid var(--line);padding:10px 14px 14px}
.mx table{border-collapse:separate;border-spacing:6px 6px;margin:-6px}
.mx th{font:500 11px var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 2px;white-space:nowrap}
.mx td.fn{font-size:13px;white-space:nowrap;padding-right:8px}
.mx td.fn div{display:flex;align-items:center;gap:7px}
.mx td.fn small{color:var(--muted);font:400 11.5px var(--font-m)}
.cell{width:68px;aspect-ratio:4/5;border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--well);padding:0;display:block}

.cell.miss{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);cursor:default}
.cell.dim{opacity:.28}
.cell .dot{position:absolute;right:4px;top:4px;box-shadow:0 0 0 2px #fff}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* visor */
#viewer{position:fixed;inset:0;z-index:20;background:#0D0E0F;color:#ECEEEF;display:flex;flex-direction:column;--vl:#2A2E32;--vs:#17191B;--vm:#9BA3AA}
.vtop{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--vl);background:var(--vs)}
.vtop .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.vtop .ttl b{font:500 14px var(--font-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .ttl span{font-size:12.5px;color:var(--vm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid var(--vl);background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.ib:hover{background:#24282C}
.ib[aria-pressed="true"]{background:#ECEEEF;color:#0D0E0F;border-color:#ECEEEF}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.t{width:auto;padding:0 11px;font-size:13px;font-weight:500;gap:6px}
.vbody{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;overflow:hidden;min-width:0;touch-action:none;background:#0D0E0F}
.wrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:#D9D3C9}
.wrap img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.wrap.none{background:repeating-linear-gradient(135deg,#1c1f22 0 12px,#141618 12px 24px);display:flex;align-items:center;justify-content:center;color:var(--vm);text-align:center;padding:20px}
.stage.draw{cursor:crosshair}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:64px;border:0;border-radius:8px;background:rgba(13,14,15,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.nav.p{left:8px}.nav.n{right:8px}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.tag{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(13,14,15,.78);border:1px solid var(--vl);font-size:12.5px;padding:5px 11px;border-radius:999px;white-space:nowrap;pointer-events:none}
.dtools{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(23,25,27,.94);border:1px solid var(--vl);padding:6px;border-radius:12px;max-width:calc(100% - 16px)}
.col{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;flex:none}
.col[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #0D0E0F inset}
.panel{width:384px;flex:none;border-left:1px solid var(--vl);background:var(--vs);overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:14px}
.panel h4{margin:0 0 6px;font:500 11px var(--font-d);letter-spacing:.09em;text-transform:uppercase;color:var(--vm)}
.panel .d{font:600 17px/1.25 var(--font-d);text-wrap:balance}
.panel .m{font-size:13px;color:var(--vm)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--vl);background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.tab[aria-pressed="true"]{background:#ECEEEF;color:#0D0E0F;border-color:#ECEEEF}
.tab.miss{border-style:dashed;color:var(--vm)}
.tab .sw{border-color:rgba(255,255,255,.35)}
.stbox{border:1px solid var(--vl);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stbox .now{display:flex;align-items:center;gap:8px;font-weight:600}
.stbox .acts{display:flex;flex-wrap:wrap;gap:8px}
.vb{border:1px solid var(--vl);background:transparent;color:inherit;border-radius:8px;padding:9px 13px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.vb.ok{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.vb.go{background:#ECEEEF;border-color:#ECEEEF;color:#0D0E0F}
.vb.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.vb[disabled]{opacity:.4;cursor:default}
.cmt{border:1px solid var(--vl);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cmt.done{opacity:.62}
.cmt.sel{border-color:#ECEEEF}
.cmt .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--vm);flex-wrap:wrap}
.cmt .h b{color:#ECEEEF;font-weight:600}
.cmt .num{font:600 11px var(--font-m);width:20px;height:20px;border-radius:50%;background:#E5352B;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cmt.done .num{background:#1F7A4D}
.cmt p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .a{display:flex;flex-wrap:wrap;gap:6px}
.loc{font:500 10.5px var(--font-d);letter-spacing:.06em;text-transform:uppercase;border:1px solid #F0994A;color:#F0994A;border-radius:4px;padding:1px 5px}
.comp{display:flex;flex-direction:column;gap:8px}
.comp textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--vl);border-radius:10px;background:#0D0E0F;color:#ECEEEF;padding:10px 12px}
.comp .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hint{font-size:12.5px;color:var(--vm);margin:0}
.cf{border:1px solid #F0994A;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
#viewer.hidep .panel{display:none}
@media (max-width:860px){
  .vbody{flex-direction:column}
  .stage{flex:1 1 54%;min-height:240px}
  .panel{width:auto;flex:1 1 46%;border-left:0;border-top:1px solid var(--vl)}
  #viewer.drawing .panel{display:none}
  .nav{display:none}
  .vtop{flex-wrap:wrap}.vtop .ttl{order:9;flex:1 0 100%}.vtop #vPos{margin-left:auto}
}

/* cajón de revisión */
#drawer{position:fixed;inset:0;z-index:30;background:rgba(13,14,15,.5);display:flex;justify-content:flex-end}
.dw{width:min(520px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column}
.dw header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dw h2{margin:0;font:600 18px var(--font-d)}
.dw .b{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.rq{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;background:none;text-align:left;width:100%}
.rq .tb{position:static;width:56px;aspect-ratio:4/5;border-radius:6px;background-color:var(--well);flex:none}
.rq div{min-width:0;display:flex;flex-direction:column;gap:3px}
.rq small{color:var(--muted);font-size:12.5px}
.rq p{margin:0;font-size:14px;overflow-wrap:anywhere}
.dw textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font:12px var(--font-m)}
.dw h3{margin:6px 0 0;font:500 11px var(--font-d);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dw .nm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dw .nm input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;flex:1 1 180px}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.card form,.card>div:last-child{display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:600 20px var(--font-d)}
.card .fld{max-width:none;flex:none}
.ahint{margin:0;color:var(--muted);font-size:14px}.aerr{margin:0;color:var(--chg);font-size:14px;min-height:1em}
.alinks{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.lnk{border:0;background:none;color:var(--accent);padding:4px 0;text-decoration:underline;font-size:14px}
.dsec{display:flex;flex-direction:column;gap:12px}
.usr{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;align-items:center;justify-content:space-between}
.usr div{min-width:0;display:flex;flex-direction:column;gap:2px}.usr small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#16191C;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.chip{transition:border-color .12s}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>COSMIC</b><span>Revisión de imágenes</span></div>
    <div class="prog"><div class="bar" id="bar"></div><small id="ptxt">Cargando catálogo…</small></div>
    <button class="btn" id="bSum" type="button">Cambios pedidos <span class="n z" id="nChg">0</span></button>
    <span class="conn" id="conn"></span>
    <button class="btn sm" id="bAcc" type="button" hidden></button>
    <button class="btn sm" id="bOut" type="button" hidden>Salir</button>
  </header>
  <div id="scroll">
    <section class="filters" aria-label="Filtros">
      <details class="fbox" id="fbox"><summary id="fsum">Filtros</summary>
      <div class="frow">
        <div class="fld q"><label for="fq">Buscar</label><input id="fq" type="search" placeholder="Referencia, familia o descripción" autocomplete="off"></div>
        <div class="fld"><label for="fcol">Colección</label><select id="fcol"></select></div>
        <div class="fld"><label for="ftipo">Tipología</label><select id="ftipo"></select></div>
        <div class="fld"><label for="ffin">Acabado</label><select id="ffin"></select></div>
        <div class="fld"><label for="fview">Vista</label><select id="fview"></select></div>
        <div class="fld"><label for="fsort">Orden</label><select id="fsort"><option value="ref">Orden del Excel</option><option value="new">Más recientes primero</option><option value="st">Por estado</option></select></div>
      </div></details>
      <div class="chips" id="stChips" role="group" aria-label="Estado"></div>
    </section>
    <div class="tools">
      <div class="frow">
        <div class="seg" role="group" aria-label="Modo de vista">
          <button type="button" id="mImg" aria-pressed="true">Imágenes</button>
          <button type="button" id="mAcc" aria-pressed="false">Accesorios</button>
        </div>

<script>
(()=>{'use strict';

/* ---------- datos ---------- */
function build(){

function rv(sku){return REV[sku];}
function cms(s){const r=rv(s.sku);if(!r||!r.c)return[];const vk=VK[s.vi],o=[];for(const id in r.c){const c=r.c[id];if(c&&c.view===vk&&!c.del)o.push(Object.assign({id},c));}return o.sort((a,b)=>(a.at||0)-(b.at||0));}

}

/* ---------- datos compartidos (Supabase) ---------- */

async function setOk(s,on){const row=Object.assign({slot:s.id,s:on?'ok':'',v:s.img.v,at:new Date().toISOString()},stamp());
  const{error}=await sb.from('rev_status').upsert(row);if(error)fail(error);applyStatus(row);refresh(true);}
async function setOkMany(slots){const rows=slots.map(s=>Object.assign({slot:s.id,s:'ok',v:s.img.v,at:new Date().toISOString()},stamp()));
  for(let i=0;i<rows.length;i+=200){const{error}=await sb.from('rev_status').upsert(rows.slice(i,i+200));if(error)fail(error);}rows.forEach(applyStatus);refresh(true);}
async function addCm(s,text,strokes){const row=Object.assign({slot:s.id,v:s.img.v,text,strokes},stamp());

const CMAP={done:'done',doneAt:'done_at',doneV:'done_v',note:'note',del:'deleted'};

async function fetchAll(t){let out=[],from=0;for(;;){const{data,error}=await sb.from(t).select('*').range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000;}return out;}

async function signed(p){const c=SIGN[p];if(c&&c.t>Date.now())return c.u;const{data,error}=await sb.storage.from(CFG.bucket).createSignedUrl(p,43200);if(error)throw error;SIGN[p]={u:data.signedUrl,t:Date.now()+4e7};return data.signedUrl;}

/* ---------- filtros y lista ---------- */
function passBase(s){
  const f=s.fam;
  if(F.col&&f.col!==F.col)return false;
  if(F.tipo&&f.t!==F.tipo)return false;
  if(F.fin&&s.fin!==F.fin)return false;
  if(F.view!==''&&s.vi!==+F.view)return false;
  if(F.q){const q=F.q.toLowerCase().trim();if(q&&!(f.lc.includes(q)||s.sku.toLowerCase().includes(q)||s.fin.toLowerCase().includes(q)))return false;}
  return true;
}
function passState(s,st){
  if(F.st==='con'){if(st==='falta')return false;}else if(F.st&&F.st!==st)return false;
  if(F.unseen&&!unseen(s))return false;
  if(F.cm&&!cms(s).length)return false;
  return true;
}
const ORD={cambios:0,corregida:1,revisar:2,ok:3,falta:4};
function compute(){
  const cnt={falta:0,revisar:0,cambios:0,corregida:0,ok:0};const out=[];
  let all={falta:0,revisar:0,cambios:0,corregida:0,ok:0};
  for(const s of SLOTS){const st=stOf(s);s.st=st;all[st]++;if(!passBase(s))continue;cnt[st]++;if(passState(s,st))out.push(s);}
  if(F.sort==='new')out.sort((a,b)=>((b.img&&b.img.d)||'').localeCompare((a.img&&a.img.d)||'')||a.n-b.n);
  else if(F.sort==='st')out.sort((a,b)=>ORD[a.st]-ORD[b.st]||a.n-b.n);

}
function refresh(keep){

  const bar=$('#bar');bar.replaceChildren(...['ok','fix','chg','rev'].map((k,i)=>h('i',{class:k,style:'width:'+(100*[all.ok,all.corregida,all.cambios,all.revisar][i]/tot)+'%'})));
  $('#ptxt').textContent=`${made} de ${tot} imágenes hechas · ${all.ok} OK · ${all.revisar} pendientes de revisión · ${all.cambios} de corrección · ${all.corregida} de validación`;

  $('#stChips').replaceChildren(...chips.map(c=>h('button',{class:'chip',type:'button','aria-pressed':String(F.st===c[0]),onclick:()=>{F.st=c[0];save();refresh();}},c[3]&&h('span',{class:'dot '+c[3]}),c[1],h('span',{class:'c',text:c[2]}))));

  {const na=['q','col','tipo','fin','view'].filter(k=>F[k]!=='').length;$('#fsum').textContent='Filtros y búsqueda'+(na?` (${na} activo${na>1?'s':''})`:'');}

}
function save(){LS.set('cosmic_filters',F);}
function thumb(s){const t=CAT.th[s.fam.f];if(!t)return h('span',{class:'tb'});const r=t.rows.indexOf(s.code),n=t.rows.length;return h('span',{class:'tb',style:`background-image:url("${(SIGN[t.f]||{}).u||''}");background-size:${VIEWS.length*100}% ${n*100}%;background-position:${VIEWS.length>1?s.vi/(VIEWS.length-1)*100:0}% ${n>1?r/(n-1)*100:0}%`});}

  const st=ST[s.st],c=cms(s),open=c.filter(x=>!x.done).length;
  return h('button',{class:'tile',type:'button',onclick:()=>openV(s.id),'aria-label':`${s.sku} ${VIEWS[s.vi][2]} ${s.fin}. ${st[0]}`},
    s.img?h('span',{class:'ph'},thumb(s),s.st!=='revisar'?h('span',{class:'pill '+st[1],text:st[0]}):null,c.length?h('span',{class:'cm',text:(open||c.length)+(open?' cambio'+(open>1?'s':''):' resuelto'+(c.length>1?'s':''))}):null,unseen(s)?h('span',{class:'new',title:'Sin ver'}):null)
         :h('span',{class:'ph miss'},h('span',{text:'Falta'})),
    h('span',{class:'cap'},h('span',{class:'s',text:s.sku}),h('span',{class:'v'},sw(s.fin),h('span',{text:VIEWS[s.vi][2]+' · '+s.fin}))));
}
function famCard(f){
  const made=f.slots.filter(s=>s.img).length,ok=f.slots.filter(s=>s.st==='ok').length,chg=f.slots.filter(s=>s.st==='cambios').length;
  const inList=new Set(list.filter(s=>s.fam===f).map(s=>s.id));
  const open=made>0||f.open;
  const card=h('article',{class:'fam'},h('header',null,
    h('div',null,h('h3',{text:f.d}),h('div',{class:'meta'},h('span',{class:'mono',text:f.f}),' · '+f.col+(f.dim?' · '+f.dim:''))),
    h('div',{class:'sum'},h('span',{text:`${made}/${f.slots.length} hechas`}),ok?h('span',null,h('span',{class:'dot ok'}),' '+ok+' OK'):null,chg?h('span',null,h('span',{class:'dot chg'}),' '+chg+' por corregir'):null,
      !made?h('button',{class:'btn sm',type:'button',onclick:()=>{f.open=!f.open;refresh(true);}},f.open?'Ocultar huecos':'Ver huecos'):null)));
  if(open){
    const tb=h('table',null,h('tr',null,h('th',{text:'Acabado'}),VIEWS.map(v=>h('th',{text:v[2]}))));
    for(let i=0;i<f.s.length;i++){const nv=VIEWS.length,row=f.slots.slice(i*nv,i*nv+nv);
      tb.append(h('tr',null,h('td',{class:'fn'},h('div',null,sw(row[0].fin),h('span',null,row[0].fin,' ',h('small',{text:row[0].code})))),
        row.map(s=>h('td',null,s.img?h('button',{class:'cell'+(inList.has(s.id)?'':' dim'),type:'button',onclick:()=>openV(s.id),title:`${s.sku} · ${VIEWS[s.vi][2]} · ${ST[s.st][0]}`},thumb(s),h('span',{class:'dot '+ST[s.st][1]})):h('div',{class:'cell miss'+(inList.has(s.id)?'':' dim'),title:s.sku+' · '+VIEWS[s.vi][2]+' · Falta'})))));
    }

function renderList(keep){
  const root=$('#list');const n=Math.max(shown,F.lay==='img'?PAGE:10);
  if(F.lay==='img'){
    if(!list.length){root.replaceChildren(h('p',{class:'empty',text:'No hay imágenes con estos filtros.'}));shown=0;return;}
    const g=h('div',{class:'grid'});shown=Math.min(n,list.length);for(let i=0;i<shown;i++)g.append(tile(list[i]));root.replaceChildren(g);
  }else{

  else{if(shown>=famList.length)return;const to=Math.min(shown+10,famList.length);for(let i=shown;i<to;i++)g.append(famCard(famList[i]));shown=to;}
}
function fillSelect(id,first,vals,cur){const s=$(id);s.replaceChildren(h('option',{value:'',text:first}),...vals.map(v=>h('option',{value:v[0],text:v[1]})));s.value=cur;}
function initFilters(){
  const cc={},tt={},ff={};for(const f of FAMS){cc[f.col]=(cc[f.col]||0)+f.s.length;tt[f.t]=(tt[f.t]||0)+f.s.length;for(const s of f.s)ff[s[1]]=(ff[s[1]]||0)+1;}

    h('div',null,h('b',{text:u.name||u.email}),h('small',{text:u.email+(u.company?' · '+u.company:'')}),h('small',{text:u.role==='pending'?'Pendiente de aprobar':u.role==='admin'?'Administrador':'Acceso aprobado'})),
    u.id===me?null:u.role==='pending'?h('button',{class:'btn sm pri',type:'button',onclick:()=>setRole(u.id,'client')},'Aprobar'):u.role==='client'?h('button',{class:'btn sm',type:'button',onclick:()=>setRole(u.id,'pending')},'Quitar acceso'):null)));
}
async function setRole(id,role){const{error}=await sb.from('profiles').update({role}).eq('id',id);if(error){toast('No se ha podido cambiar el acceso.');return;}toast(role==='client'?'Acceso aprobado.':'Acceso retirado.');loadAccess();}
function openDrawer(){$('#drawer').hidden=false;renderDrawer();loadAccess();}
$('#bSum').onclick=openDrawer;$('#bAcc').onclick=openDrawer;
$('#dClose').onclick=()=>{$('#drawer').hidden=true;};
$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')$('#drawer').hidden=true;});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3600);}
function setConn(){const c=$('#conn');c.className='conn on';c.textContent=myName+(isAdmin?' · Estudio':'');$('#bOut').hidden=false;}

/* ---------- acceso ---------- */
let started=false,recovering=/type=recovery/.test(location.hash);
const field=(id,label,type,ac)=>h('div',{class:'fld'},h('label',{for:id,text:label}),h('input',{id,type,autocomplete:ac,required:true}));
const val=id=>$('#'+id).value.trim();
const ERR={'Invalid login credentials':'Correo o contraseña incorrectos.','User already registered':'Ya existe un usuario con ese correo.','Email not confirmed':'Confirma tu correo con el enlace que te hemos enviado.'};
function showErr(e){$('#aerr').textContent=ERR[e.message]||('No se ha podido completar: '+e.message);}
function authView(kind,msg){
  $('#auth').hidden=false;const err=h('p',{class:'aerr',id:'aerr',text:kind==='msg'?'':(msg||'')});
  const link=(t,k)=>h('button',{class:'lnk',type:'button',onclick:()=>authView(k)},t);let body;
  if(kind==='login')body=h('form',{onsubmit:doLogin},h('h2',{text:'Entrar'}),field('aEmail','Correo electrónico','email','username'),field('aPass','Contraseña','password','current-password'),err,
    h('button',{class:'btn pri',type:'submit'},'Entrar'),h('div',{class:'alinks'},link('Solicitar acceso','signup'),link('He olvidado la contraseña','reset')));
  else if(kind==='signup')body=h('form',{onsubmit:doSignup},h('h2',{text:'Solicitar acceso'}),h('p',{class:'ahint',text:'Crea tu usuario. El estudio tiene que aprobarlo antes de que puedas ver las imágenes.'}),
    field('aName','Nombre y apellidos','text','name'),field('aComp','Empresa','text','organization'),field('aEmail','Correo electrónico','email','username'),field('aPass','Contraseña (mínimo 8 caracteres)','password','new-password'),err,
    h('button',{class:'btn pri',type:'submit'},'Solicitar acceso'),h('div',{class:'alinks'},link('Ya tengo usuario','login')));
  else if(kind==='pending')body=h('div',null,h('h2',{text:'Acceso pendiente de aprobación'}),h('p',{class:'ahint',text:'Tu usuario está creado. En cuanto el estudio lo apruebe podrás ver las imágenes.'}),err,
    h('div',{class:'alinks'},h('button',{class:'btn pri',type:'button',onclick:start},'Comprobar de nuevo'),h('button',{class:'btn',type:'button',onclick:logout},'Cerrar sesión')));
  else if(kind==='reset')body=h('form',{onsubmit:doReset},h('h2',{text:'Cambiar la contraseña'}),h('p',{class:'ahint',text:'Te enviaremos un enlace a tu correo.'}),field('aEmail','Correo electrónico','email','username'),err,
    h('button',{class:'btn pri',type:'submit'},'Enviar enlace'),h('div',{class:'alinks'},link('Volver','login')));
  else if(kind==='newpass')body=h('form',{onsubmit:doNewPass},h('h2',{text:'Nueva contraseña'}),field('aPass','Contraseña nueva (mínimo 8 caracteres)','password','new-password'),err,h('button',{class:'btn pri',type:'submit'},'Guardar contraseña'));
  else body=h('div',null,h('h2',{text:'Revisa tu correo'}),h('p',{class:'ahint',text:msg||''}),h('div',{class:'alinks'},link('Volver','login')));
  $('#authCard').replaceChildren(h('div',{class:'brand'},h('b',{text:'COSMIC'}),h('span',{text:'Revisión de imágenes'})),body);
}
async function doLogin(ev){ev.preventDefault();const{error}=await sb.auth.signInWithPassword({email:val('aEmail'),password:$('#aPass').value});if(error)return showErr(error);start();}
async function doSignup(ev){ev.preventDefault();if($('#aPass').value.length<8)return showErr({message:'la contraseña debe tener al menos 8 caracteres.'});
  const{data,error}=await sb.auth.signUp({email:val('aEmail'),password:$('#aPass').value,options:{data:{name:val('aName'),company:val('aComp')},emailRedirectTo:location.origin+location.pathname}});
  if(error)return showErr(error);if(data.session)start();else authView('msg','Te hemos enviado un correo para confirmar tu dirección. Después, el estudio aprobará tu acceso.');}
async function doReset(ev){ev.preventDefault();const{error}=await sb.auth.resetPasswordForEmail(val('aEmail'),{redirectTo:location.origin+location.pathname});if(error)return showErr(error);authView('msg','Si el correo existe, recibirás un enlace para cambiar la contraseña.');}
async function doNewPass(ev){ev.preventDefault();if($('#aPass').value.length<8)return showErr({message:'la contraseña debe tener al menos 8 caracteres.'});
  const{error}=await sb.auth.updateUser({password:$('#aPass').value});if(error)return showErr(error);recovering=false;try{location.replace('#galeria');}catch(e){}start();}
async function logout(){try{await sb.auth.signOut();}catch(e){}location.reload();}
$('#bOut').onclick=logout;
async function start(){
  if(recovering){authView('newpass');return;}
  let session=null;try{session=(await sb.auth.getSession()).data.session;}catch(e){}
  if(!session){authView('login');return;}
  me=session.user.id;
  const{data:p,error}=await sb.from('profiles').select('*').eq('id',me).maybeSingle();
  if(error||!p){authView('pending',error?'No se ha podido comprobar tu acceso. Inténtalo de nuevo.':'');return;}
  if(p.role==='pending'){authView('pending');return;}
  isAdmin=p.role==='admin';myName=p.name||p.email;$('#auth').hidden=true;
  if(started)return;started=true;loadApp();
}
async function loadApp(){
  try{
    const u=await signed('data/catalog.json');CAT=await(await fetch(u,{cache:'no-store'})).json();
    build();await signSprites();initFilters();mode='db';setConn();refresh();await loadRev();fromHash();window.addEventListener('hashchange',fromHash);
    sb.channel('rev').on('postgres_changes',{event:'*',schema:'public',table:'rev_status'},rtLoad).on('postgres_changes',{event:'*',schema:'public',table:'rev_comments'},rtLoad).subscribe();
    document.addEventListener('visibilitychange',()=>{if(document.hidden)return;loadRev();if(Date.now()-signedAt>36e6)signSprites().then(()=>refresh(true)).catch(()=>{});});
    loadAccess();
  }catch(e){console.error(e);$('#ptxt').textContent='No se ha podido cargar el catálogo. Recarga la página.';}
}
function fromHash(){const id=location.hash.slice(1).replace(/-closeup-0/,'_closeup_0').replace(/-despiece$/,'_despiece').replace(/-ambiente$/,'_ambiente');if(id&&BYID[id]){if(!V.cur||V.cur.id!==id)openV(id,true);}}
function init(){
  if(!window.supabase||CFG.url.indexOf('__')===0){$('#authCard').append(h('p',{class:'aerr',text:'Falta configurar la conexión con la base de datos.'}));return;}
  sb=supabase.createClient(CFG.url,CFG.key);
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;authView('newpass');}});
  start();
}
init();
})();
</script>
</body>
</html>
